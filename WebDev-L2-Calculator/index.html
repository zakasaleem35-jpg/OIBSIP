<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator | Zaka Saleem Hamdani</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="calculator">

        <!-- ===== Display ===== -->
        <div class="display" aria-live="polite">
            <div class="expression" id="expression"></div>
            <div class="current" id="current">0</div>
        </div>

        <!-- ===== Keypad (laid out with CSS Grid) ===== -->
        <!-- No inline onclick handlers: all clicks are handled in script.js -->
        <div class="keys" id="keys">
            <button class="key key-fn"  data-action="clear">C</button>
            <button class="key key-fn"  data-action="backspace" aria-label="Backspace">⌫</button>
            <button class="key key-op"  data-value="÷">÷</button>
            <button class="key key-op"  data-value="×">×</button>

            <button class="key" data-value="7">7</button>
            <button class="key" data-value="8">8</button>
            <button class="key" data-value="9">9</button>
            <button class="key key-op"  data-value="−">−</button>

            <button class="key" data-value="4">4</button>
            <button class="key" data-value="5">5</button>
            <button class="key" data-value="6">6</button>
            <button class="key key-op"  data-value="+">+</button>

            <button class="key" data-value="1">1</button>
            <button class="key" data-value="2">2</button>
            <button class="key" data-value="3">3</button>
            <button class="key key-equals" data-action="equals">=</button>

            <button class="key key-zero" data-value="0">0</button>
            <button class="key" data-value=".">.</button>
        </div>

    </main>

    <p class="credit">Built by Zaka Saleem Hamdani · Oasis Infobyte Internship · Keyboard supported</p>

    <script src="script.js"></script>
</body>
</html>
